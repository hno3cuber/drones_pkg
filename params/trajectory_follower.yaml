trajectory_follower:
  ros__parameters:
    # ------------------------------------------------------------------
    # 参考轨迹文件
    # ------------------------------------------------------------------
    # 轨迹文件路径。
    # 支持两种格式：
    #   1) 两行 x/y（第一行 x，第二行 y），无时间列 —— 用 dt 参数作为步长
    #   2) 每行一列，第 0 列为 t，第 1 列为 x，第 2 列为 y
    trajectory_file: ""          # 空则用包内默认 src/uav0.csv

    # 相邻轨迹点之间的时间步长 [s]，仅用于两行 x/y 格式
    dt: 0.1

    # ------------------------------------------------------------------
    # 坐标系
    # ------------------------------------------------------------------
    # true  : csv 为 ENU (x=East, y=North) -> NED: x_ned=y, y_ned=x
    # false : csv 已经是 NED (x=North, y=East)
    frame_is_enu: true

    # ------------------------------------------------------------------
    # 轨迹高度
    # ------------------------------------------------------------------
    # 目标飞行高度 [m]（相对 local 原点 / 起飞点），内部会转成 NED 的 -altitude
    flight_altitude: 5.0

    # ------------------------------------------------------------------
    # 轨迹起点偏移
    # 无人机起飞点(local origin)与轨迹原点之间的平移补偿 [m]（NED 系）
    # 若希望无人机从当前位置直接飞向轨迹起点，保持默认即可
    # ------------------------------------------------------------------
    origin_offset_ned_x: 0.0
    origin_offset_ned_y: 0.0

    # 飞向轨迹起点时的爬升/巡航速度 [m/s]
    approach_speed: 2.0

    # ------------------------------------------------------------------
    # 控制与安全
    # ------------------------------------------------------------------
    # setpoint 发布频率 [Hz]，需要 > 2Hz 才能维持 PX4 offboard 心跳
    setpoint_rate_hz: 20.0

    # 位置容差 [m]：无人机到轨迹起点的距离小于该值才切换为轨迹跟踪
    approach_tolerance: 0.5

    # 轨迹播放循环
    loop_trajectory: false

    # 轨迹结束后动作: "hold" 保持终点 / "rtl" 返回起飞点
    end_action: "hold"

    # ------------------------------------------------------------------
    # 以下参数仅供 trajectory_visualizer 使用（trajectory_follower 会忽略）
    # visualizer 只订阅实飞位置、画出无人机的三维航迹，不读轨迹文件、
    # 不画参考轨迹，因此本文件中的轨迹相关内容对它无效。
    # ------------------------------------------------------------------

    # RViz 可视坐标系。"odom" 对应 PX4 的 local NED 原点，但轴约定为 ENU
    # (x=East, y=North, z=Up)；若想直接看 NED 视觉，改成一个绕 z 转 -90° 的 frame
    frame_id: "map"

    # 实飞航迹重发频率 [Hz]
    publish_rate_hz: 10.0

    # 实飞航迹最多保留的点数，防止长时间飞行后无限增长
    path_max_points: 5000
