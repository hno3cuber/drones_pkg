# 参数段用 /** 通配匹配本文件加载到的所有节点。
# 原因：各 launch 创建的节点名并不统一（单机为 trajectory_follower_uav0，
# 多机为 uav0/uav1/...），若写死成某一个节点名，其余节点就匹配不到，
# 整份参数不会生效。用 /** 可让全部 follower/visualizer 节点都读到。
/**:
  ros__parameters:
    # ------------------------------------------------------------------
    # PX4 实例
    # ------------------------------------------------------------------
    # PX4 话题命名空间。单机为 /fmu；多机分别为 /fmu、/px4_1/fmu、
    # /px4_2/fmu ...（对应 PX4 实例 0/1/2...）。
    node_namespace: "/fmu"

    # 目标 PX4 系统 ID（MAV_SYS_ID）。多机时必须与各自的 PX4 实例对应，
    # 否则 arm / offboard / rtl 命令会全发到同一架。通常 uav0->1, uav1->2 ...
    target_system: 1

    # ------------------------------------------------------------------
    # 参考轨迹文件
    # ------------------------------------------------------------------
    # 轨迹文件路径。
    # 支持两种格式：
    #   1) 两行 x/y（第一行 x，第二行 y），无时间列 —— 用 dt 参数作为步长
    #   2) 每行一列，第 0 列为 t，第 1 列为 x，第 2 列为 y
    # 轨迹文件路径。必填：为空则节点启动失败。
    # 通常由 launch 传入（单机 launch 默认 ref.csv，多机 launch 分别传各自的 csv；
    # 四架的身份与轨迹见 launch/uav_config.py）。
    trajectory_file: ""

    # 相邻轨迹点之间的时间步长 [s]，仅用于两行 x/y 格式
    dt: 0.1

    # ------------------------------------------------------------------
    # 坐标系
    # ------------------------------------------------------------------
    # true  : csv 为 ENU (x=East, y=North) -> NED: x_ned=y, y_ned=x
    # false : csv 已经是 NED (x=North, y=East)
    frame_is_enu: true

    # ------------------------------------------------------------------
    # 轨迹高度
    # ------------------------------------------------------------------
    # 目标飞行高度 [m]（相对 local 原点 / 起飞点），内部会转成 NED 的 -altitude
    flight_altitude: 5.0

    # ------------------------------------------------------------------
    # 轨迹起点偏移
    # 无人机起飞点(local origin)与轨迹原点之间的平移补偿 [m]（NED 系）
    # 若希望无人机从当前位置直接飞向轨迹起点，保持默认即可
    # ------------------------------------------------------------------
    origin_offset_ned_x: 0.0
    origin_offset_ned_y: 0.0

    # 飞向轨迹起点时的爬升/巡航速度 [m/s]
    approach_speed: 2.0

    # ------------------------------------------------------------------
    # 控制与安全
    # ------------------------------------------------------------------
    # setpoint 发布频率 [Hz]，需要 > 2Hz 才能维持 PX4 offboard 心跳
    setpoint_rate_hz: 20.0

    # 位置容差 [m]：无人机到轨迹起点的距离小于该值才切换为轨迹跟踪
    approach_tolerance: 0.5

    # 轨迹播放循环
    loop_trajectory: false

    # ------------------------------------------------------------------
    # 避障
    # 在轨迹加载后做一次性预处理：把落入障碍安全圆的连续轨迹段
    # 替换成沿圆周走的弧（进出点用圆外相邻点插值求出），
    # 运行时按处理后的轨迹正常采样，不再做几何计算。
    # 因此弧上会重新铺点，绕行段的飞行时间会略微变长。
    # ------------------------------------------------------------------

    # 总开关。false 时完全按参考轨迹飞，不做任何修正。
    avoidance_enable: true

    # 障碍圆心位置，扁平数组 [x0, y0, x1, y1, ...]，与 trajectory_follower
    # 的坐标约定一致：默认按 ENU 解释（frame_is_enu=true 即 North=y, East=x）。
    # 默认三根圆柱，与 obstacle_visualizer 的 obstacles 保持同一组坐标。
    avoidance_obstacles: [4.0, 4.0, 7.0, 7.0, 15.0, 4.0]

    # 安全圆半径 [m]：以圆心为中心，轨迹进入该半径内即改为沿圆弧绕行。
    # 1.5 = 圆柱半径 0.75 + 0.75 安全余量。
    avoidance_radius: 1.5

    # 绕行弧走向：
    #   "short" 走两交点间角度差小的一侧（默认，与加本参数前的行为一致）
    #   "long"  走另一侧（角度差大，弧从外侧包过去）
    # 单侧弧是否“从上面/外面绕”取决于进出方位角，先用导出图确认再定。
    avoidance_arc_side: "short"

    # 按障碍下标逐项覆盖 avoidance_arc_side，顺序与 avoidance_obstacles 一致。
    # 例：[short, long, short] 表示第 1/3 个障碍用 short、第 2 个用 long；
    # 元素数不足的障碍沿用 avoidance_arc_side。
    # 注意：ROS 2 参数文件不能写空序列（[]），不需要时整项留空（用代码默认），
    # 需要时在命令行 / 本文件写完整列表：
    # avoidance_arc_side_by_obstacle: ["short", "long", "short"]

    # 轨迹结束后动作: "hold" 保持终点 / "rtl" 返回起飞点
    end_action: "hold"

    # ------------------------------------------------------------------
    # 以下参数仅供 trajectory_visualizer 使用（trajectory_follower 会忽略）
    # visualizer 只订阅实飞位置、画出无人机的三维航迹，不读轨迹文件、
    # 不画参考轨迹，因此本文件中的轨迹相关内容对它无效。
    # ------------------------------------------------------------------

    # RViz 可视坐标系。"odom" 对应 PX4 的 local NED 原点，但轴约定为 ENU
    # (x=East, y=North, z=Up)；若想直接看 NED 视觉，改成一个绕 z 转 -90° 的 frame
    frame_id: "map"

    # 要可视化的 PX4 实例命名空间列表。每架发一条独立话题：
    #   /fmu       -> ~/fmu/flown_path
    #   /px4_1/fmu -> ~/px4_1_fmu/flown_path
    # 多机 launch 会覆盖为四条。
    uav_namespaces: ["/fmu"]

    # 实飞航迹重发频率 [Hz]。只在航迹有新增点时才会发布整条 Path；
    # 悬停不动时不发。频率越低，大点数时的峰值带宽越小。
    publish_rate_hz: 2.0

    # 实飞航迹最多保留的点数，防止长时间飞行后无限增长。
    # 参考：位置话题约 30~50Hz，500000 点约可保留 2.5~4.5 小时实飞航迹，
    # 足够覆盖单次飞行全程。发布已改为“有新点才重发整条”，
    # 因此点数不再线性放大流量。
    path_max_points: 500000


obstacle_visualizer:
  ros__parameters:
    # ------------------------------------------------------------------
    # 静态障碍物可视化节点
    # 不参与控制，只往 RViz 发 MarkerArray；位置按 ENU 解释，圆柱底面贴地。
    # ------------------------------------------------------------------

    # RViz 可视坐标系，与 trajectory_visualizer 保持一致
    frame_id: "map"

    # 障碍物圆心位置，扁平数组 [x0, y0, x1, y1, ...]（ENU 平面）
    # 默认三根圆柱：(4,4) (7,7) (15,4)
    obstacles: [4.0, 4.0, 7.0, 7.0, 15.0, 4.0]

    # 圆柱半径 [m]
    obstacle_radius: 0.75

    # 圆柱高度 [m]：底面贴地，即占据 z ∈ [0, obstacle_height]
    obstacle_height: 5.0

    # MarkerArray 重发频率 [Hz]；publisher 为 transient_local，
    # 这里只是兜底，保证 RViz 中途重载配置后仍能看到障碍物。
    publish_rate_hz: 1.0

    # 颜色与透明度
    color_r: 0.85
    color_g: 0.20
    color_b: 0.20
    alpha: 1.0

    # ------------------------------------------------------------------
    # 参考轨迹线
    # 两行 x/y 格式的 csv（第一行 x、第二行 y），逐列配对成 (x_i, y_i)，
    # 用一条 LINE_STRIP 画出来。留空则不画。
    # ------------------------------------------------------------------

    # 轨迹文件路径。通常由 launch 传入绝对路径；直接跑节点时需自己填。
    path_file: ""

    # 轨迹线所在高度 [m]，默认 0（贴地）
    # 注意：抬离地面一点点（如 0.1）可以避免与 RViz 的 Grid 在 z=0 平面
    # 发生 z-fighting，导致线看起来断断续续。
    path_altitude: 4.9

    # 线宽 [m]
    path_line_width: 0.3

    # 轨迹线颜色与透明度
    path_color_r: 0.20
    path_color_g: 0.65
    path_color_b: 1.00
    path_alpha: 1.00


# ---------------------------------------------------------------------------
# uav_link_visualizer
# 订阅各架无人机实时位置，启动后每架取第一帧有效位置作快照（不再更新），
# 给每架打一个点，再把所有点两两连起来（完全图 K_n）。不参与控制。
# ---------------------------------------------------------------------------
uav_link_visualizer:
  ros__parameters:
    # RViz 可视坐标系，与其它可视化节点保持一致
    frame_id: "map"

    # 各架 PX4 实例命名空间列表。节点订阅 <ns>/out/vehicle_local_position_v1。
    # 单机为 ["/fmu"]；四机为下面这组。
    uav_namespaces: ["/fmu", "/px4_1/fmu", "/px4_2/fmu", "/px4_3/fmu"]

    # 点与连线统一所在高度 [m]（ENU 的 z）。不使用飞机实时高度，
    # 四个点都被钉在这一水平面上。
    point_altitude: 5.0

    # 点大小 [m]（SPHERE 的 scale.x）
    point_size: 0.4

    # 连线线宽 [m]（LINE_LIST 的 scale.x）
    line_width: 0.08

    # true 全连接（C(n,2) 条边）；false 只连相邻序号 (0-1, 1-2, ...)
    connect_all: true

    # 点的透明度（颜色按序号自动分配，四机依次为红/绿/蓝/黄）
    point_alpha: 1.0

    # 连线颜色与透明度（所有边共用一个颜色）
    link_color_r: 0.90
    link_color_g: 0.90
    link_color_b: 0.95
    link_alpha: 0.85

    # 等待快照的超时 [s]。超时后仍缺的点不再等，有几架画几架；
    # 0 表示无限等待。
    snapshot_timeout_s: 5.0

    # MarkerArray 重发频率 [Hz]；publisher 为 transient_local，
    # 这里只是兜底，保证 RViz 中途重载配置后仍能看到内容。
    publish_rate_hz: 1.0


trajectory_plotter:
  ros__parameters:
    # ------------------------------------------------------------------
    # 到点绘图节点
    # 跟踪任务期间累积无人机到各障碍物中轴线的距离，收到 trajectory_follower
    # 发出的 <node_namespace>/trajectory_finished 后弹出一张曲线图。
    # 距离定义与 obstacle_visualizer 的几何一致：障碍物几何优先从
    # obstacle_visualizer 的 MarkerArray 读取，未到达时用 fallback 兜底。
    # ------------------------------------------------------------------

    # PX4 话题命名空间，需与同一架无人机的 trajectory_follower 一致
    node_namespace: "/fmu"

    # 障碍物 MarkerArray 话题
    obstacles_topic: "/obstacle_visualizer/markers"

    # 红色虚线的 y 值 [m]。距离算到中轴线，因此 0.75（=柱子半径）
    # 表示「无人机已经进到柱体内部」这条界线。
    safe_distance: 0.75

    # 距离采样频率 [Hz]，需足够密才不至于在曲线上漏掉快速穿越
    compute_rate_hz: 20.0

    # 距离计算是否要求 PX4 的 z 有效
    drone_z_valid: true

    # matplotlib 后端。弹窗交互用 "TkAgg"（需图形环境）；
    # 无头环境改用 "Agg" 并配 output_png 看图片。
    backend: "TkAgg"

    # 非空时把图同时保存到该路径（如 /home/hno3/flight.png）
    output_png: ""

    # MarkerArray 未到达时的兜底障碍物圆心，扁平数组 [x0, y0, x1, y1, ...]
    fallback_obstacles: [4.0, 4.0, 7.0, 7.0, 15.0, 4.0]
